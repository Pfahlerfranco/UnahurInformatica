# ==========================
# Site
# ==========================
title: "Planes y materias"
email: informatica@unahur.edu.ar
description: "Ayuda para la inscripción a materias"

url: "https://pfahlerfranco.github.io"
baseurl: "/UnahurInformatica"

language: "es"
lang: "es"

color_theme: "#4db6ad"
color_text: "#fff"

# ==========================
# Build settings
# ==========================
markdown: kramdown

# IMPORTANTE: NO usar permalink global (rompe colecciones)
# permalink: /:title/

paginate: 5
paginate_path: "/page:num/"

sass:
  style: compressed

# ==========================
# Theme
# ==========================
remote_theme: gustavoquinalha/jekyll-help-center-theme

# ==========================
# Plugins
# ==========================
plugins:
  - jekyll-paginate
  - jekyll-remote-theme

# ==========================
# Collections
# ==========================
collections:
  planes:
    output: false

  banners:
    output: false

  carreras:
    output: true
    permalink: /:name/

# ==========================
# Defaults (IMPORTANTE)
# asegura que las carreras usen layout page
# ==========================
defaults:
  - scope:
      path: ""
      type: "carreras"
    values:
      layout: "page"
